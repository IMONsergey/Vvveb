name: Materialize Vvveb upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-vvveb-upstream
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch pinned Vvveb upstream with submodules
        run: |
          git clone --recurse-submodules https://github.com/givanz/Vvveb.git /tmp/vvveb
          cd /tmp/vvveb
          git checkout 5adb8cde58b74bb95ee1bb07505efb2ff76cdfe1
          git submodule update --init --recursive
          find /tmp/vvveb -name .git -exec rm -rf {} + 2>/dev/null || true

      - name: Materialize upstream into main
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/vvveb/. .
          rm -f .github/workflows/bootstrap-vvveb.yml

          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: Vvveb CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            php-smoke:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Validate PHP syntax
                  run: |
                    find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l
          YAML

          cat > DEPLOYMENT.md <<'MD'
          # Deployment

          This branch contains a materialized copy of Vvveb upstream commit `5adb8cde58b74bb95ee1bb07505efb2ff76cdfe1` with recursive submodules copied as regular files.

          Vvveb is a PHP application and cannot execute on GitHub Pages. Use a persistent PHP/container runtime for a public deployment.
          MD

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Vvveb upstream 5adb8cde'
          git push origin HEAD:main
